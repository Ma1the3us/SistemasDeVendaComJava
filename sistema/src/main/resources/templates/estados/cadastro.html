<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeLeaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeLeaft/Layout">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1> Cadastro de Estados</h1>
    <form action="/salvarEstado" th:objects="${estado}" method="post">
        <label for="">Nome do Estado</label>
            <input type="text" th:field="*{nome}"/>
        <label for="">Sigla do Estado</label>
            <input type="text" th:field="*{sigla}"/>
            <input type="hidden" th:field="*{id}"/>

        <button type="submit">salvar</button>
    </form>
</body>

</html>
