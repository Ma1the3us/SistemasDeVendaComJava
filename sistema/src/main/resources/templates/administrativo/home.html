<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f7fa;
        }

        .card-custom {
            border-radius: 16px;
            border: 1px solid #e0e0e0;
        }

        .neon-border {
            box-shadow: 0 0 6px #00f5d4;
        }

        .btn-neon {
            border: 1px solid #00f5d4;
            color: #00c9a7;
        }

        .btn-neon:hover {
            background: #00f5d4;
            color: #000;
        }

        .search-input {
            border: 1px solid #00f5d4;
            border-radius: 12px;
            padding: 10px;
        }

        .search-input:focus {
            box-shadow: 0 0 6px #00f5d4;
            border-color: #00f5d4;
        }

        .title {
            font-size: 1.5rem;
        }

        @media (min-width: 768px) {
            .title {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>

    <div class="container py-5 d-flex justify-content-center">
        <div class="card card-custom neon-border p-4 w-100" style="max-width: 450px;">

            <h2 class="text-center mb-4 title">Sistema de Estados</h2>

            <!-- Barra de Pesquisa -->
            <form th:action="@{/estados/pesquisar}" method="get" class="mb-4">

                <input type="text" name="nome" class="form-control search-input text-center"
                    placeholder="Pesquisar estado...">

            </form>

            <!-- Botões -->
            <div class="d-grid gap-3">
                <a class="btn btn-neon w-100" th:href="@{/estados/cadastroEstado}">
                    Cadastrar
                </a>

                <a class="btn btn-neon w-100" th:href="@{/estados/listarEstado}">
                    Listar
                </a>
            </div>

        </div>
    </div>

</body>

</html>
