<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f7fa;
        }

        .neon-border {
            box-shadow: 0 0 6px #00f5d4;
        }

        .btn-neon {
            border: 1px solid #00f5d4;
            color: #00c9a7;
        }

        .btn-neon:hover {
            background: #00f5d4;
            color: black;
        }

        /* Mobile: transformar tabela em cards */
        @media (max-width: 768px) {
            table thead {
                display: none;
            }

            table,
            tbody,
            tr,
            td {
                display: block;
                width: 100%;
            }

            tr {
                margin-bottom: 15px;
                padding: 10px;
                border: 1px solid #ddd;
                border-radius: 10px;
                background: white;
            }

            td {
                text-align: left;
                padding: 5px 10px;
            }

            td::before {
                font-weight: bold;
                display: block;
            }

            td:nth-child(1)::before {
                content: "ID";
            }

            td:nth-child(2)::before {
                content: "Nome";
            }

            td:nth-child(3)::before {
                content: "Sigla";
            }

            td:nth-child(4)::before {
                content: "Ações";
            }
        }
    </style>
</head>

<body>

    <div class="container py-4">

        <h2 class="text-center mb-4">Lista de Estados</h2>

        <div class="table-responsive neon-border p-2 rounded">
            <table class="table table-hover text-center align-middle">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Sigla</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody th:each="estado : ${estados}">
                    <tr>
                        <td th:text="${estado.id}"></td>
                        <td th:text="${estado.nome}"></td>
                        <td th:text="${estado.sigla}"></td>
                        <td class="d-flex flex-column flex-md-row gap-2 justify-content-center">
                            <a class="btn btn-sm btn-neon w-100 w-md-auto"
                                th:href="@{/estados/editarEstado/{id}(id=${estado.id})}">
                                Editar
                            </a>

                            <a class="btn btn-sm btn-outline-danger w-100 w-md-auto"
                                th:href="@{/estados/removerEstado/{id}(id=${estado.id})}"
                                onclick="return confirm('Tem certeza?')">
                                Remover
                            </a>
                        </td>
                    </tr>
                </tbody>

            </table>
        </div>
        <a class="btn btn-outline-secondary w-100" th:href="@{/estados/cadastroEstado}">
            Voltar
        </a>

    </div>

</body>

</html>
