<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background-color: #f5f7fa; }

        .neon-border {
            box-shadow: 0 0 6px #00f5d4;
        }

        .btn-neon {
            border: 1px solid #00f5d4;
            color: #00c9a7;
        }

        .btn-neon:hover {
            background: #00f5d4;
            color: black;
        }

        .form-control:focus {
            border-color: #00f5d4;
            box-shadow: 0 0 5px #00f5d4;
        }
    </style>
</head>

<body>

<div class="container py-4 d-flex justify-content-center">

    <div class="card p-4 neon-border w-100" style="max-width: 500px;">

        <h2 class="text-center mb-4">Cadastro de Estado</h2>

        <form th:action="@{/estados/salvarEstado}" th:object="${estado}" method="post">

            <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" th:field="*{nome}">
            </div>

            <div class="mb-3">
                <label for="sigla" class="form-label">Sigla</label>
                <input type="text" class="form-control" th:field="*{sigla}">
            </div>

            <input type="hidden" th:field="*{id}"/>

            <div class="d-grid gap-2">
                <button class="btn btn-neon w-100">Salvar</button>

                <a class="btn btn-outline-secondary w-100"
                   th:href="@{/estados/listarEstado}">
                   Listar
                </a>
                <a class="btn btn-outline-secondary w-100"
                   th:href="@{/estados/home}">
                   Voltar
                </a>
            </div>

        </form>

    </div>

</div>

</body>
</html>
